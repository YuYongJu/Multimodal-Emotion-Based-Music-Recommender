repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: [--config-file=pyproject.toml]
        files: ^(audio_features|AutoLabel|main|recommend_spotify_playlist_music_for_tiktok_edits)\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [--configfile=pyproject.toml, --recursive]
        files: ^(audio_features|AutoLabel|GoogleVideoIntelligenceAPI|main|recommend_spotify_playlist_music_for_tiktok_edits)\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^(data/synthetic_tracks\.csv|data/synthetic_video_segments\.csv|emotion_classifier_model\.h5|results/confusion_matrix\.png)$
      - id: detect-private-key
