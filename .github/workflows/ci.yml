name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy audio_features.py AutoLabel.py main.py recommend_spotify_playlist_music_for_tiktok_edits.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -c pyproject.toml -r audio_features.py AutoLabel.py GoogleVideoIntelligenceAPI.py main.py recommend_spotify_playlist_music_for_tiktok_edits.py
      - run: pip-audit --strict --ignore-vuln GHSA-pq67-6m6q-mj2v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System deps for librosa
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=. --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
