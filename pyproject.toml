[project]
name = "multimodal-emotion-music-recommender"
version = "1.0.0"
description = "Multimodal video-to-music recommender bridging Google Cloud Video Intelligence, Spotify audio features (with librosa fallback), and a Keras emotion classifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Addison Apisarnthanarax" }]
dependencies = [
    "spotipy>=2.19.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.9",
    "numpy>=1.20.0",
    "tensorflow>=2.8.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "google-cloud-videointelligence>=2.8.0",
    "google-cloud-storage>=2.1.0",
    "python-dotenv>=0.19.0",
    "requests>=2.28.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "responses>=0.24",
    "ruff>=0.5",
    "mypy>=1.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/YuYongJu/Multimodal-Emotion-Based-Music-Recommender"
Issues   = "https://github.com/YuYongJu/Multimodal-Emotion-Based-Music-Recommender/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["audio_features", "AutoLabel", "GoogleVideoIntelligenceAPI", "main",
              "recommend_spotify_playlist_music_for_tiktok_edits", "check_excel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PIE"]
ignore = [
    "E501",  # line length — long messages and URLs are fine
    "E402",  # late imports — TF noise-suppression env var must precede TF
    "B008",  # function-call-in-default — argparse Path defaults are conventional
]
exclude = ["data/", "results/", "scripts/", "build/", "dist/"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of tests

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
exclude = ["build/", "dist/", "data/", "results/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: integration tests that load TF / train models (skipped by default)",
    "integration: tests that exercise multiple modules together",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:keras.*",
    "ignore::UserWarning:tensorflow.*",
]

[tool.bandit]
exclude_dirs = ["tests", "data", "results", ".venv", "build"]
skips = ["B101"]  # asserts; covered by ruff per-file
